<!DOCTYPE html>
<html lang= "en">
	<head>
		<meta charset="UTF-8">
		<title>CONFIRMAR COMPRA</title>

		<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
	<header>
			<nav class="navbar navbar-dark bg-dark fixed-top">
				<div class="container-fluid">
					<a class="navbar-brand" href="./index.html">M&S Market</a>
					<button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
					</button>
					<div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
					<div class="offcanvas-header">
						<h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Menú</h5>
						<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
					</div>
					<div class="offcanvas-body">
							<ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" href="./ayuda.pdf">AYUDA</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="index.html">Volver</a>
							</li>
							</ul>
						</div>
					</div>
				</div>
			</nav>
		</header>
	<main class="main-container">
		<div id="seccionDetalle" class="container"></div>
        <div id="montos" class="container form-container">
			<h2>Total</h2>
            <p>Subtotal: <b id="subtotal"></b></p>
            <p>IVA: <b id="iva"></b></p>
            <p>Total: <b id="total"></b></p>
			<form id="form-venta">
				<div class="form-group">
					<label for="usuario">Ingrese persona que retira el pedido:</label>
					<input type="text" id="usuario" name="usuario" required>
				</div>

				<div class="form-group">
					<label for="direccion">Dirección de entrega:</label>
					<input type="text" id="direccion" name="direccion" placeholder="Av. Artigas 123, Colonia">
				</div>

				<div id="map" style="height:400px; margin-top:20px;"></div>
				<input type="hidden" id="ubicacion" name="ubicacion">
				
				<button class="btn btn-primary" type="submit">Confirmar compra</button>
			</form>
        </div>
	</main>
		<script src="js/pages/confirmar-compra.js" type="module"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

	</body>
</html>
