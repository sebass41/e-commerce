<!DOCTYPE html>
<html lang= "en">
	<head>
		<meta charset="UTF-8">
		<title>Agregar una Categoría</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
 <body>
	<header>
			<h1>AGREGAR CATEGORIAS</h1>
			<a href="index.html" type="button">ATRÁS</a>
	</header>
	<main class="main-container">
		<form id="form-categoria" class="form-container container">
			<div class="form-group">
				<label for="nombre">Categoría:</label>
				<input 
					type="text" 
					id="nombre"
					name="nombre" 
					placeholder="Lacteos"
					required>
			</div>
			
			<button class="btn btn-primary" type="submit">Guardar</button>
		</form>
	</main>

	    <script src="js/storage.js"></script>
	    <script src="js/modelos.js"></script>
	    <script src="js/gestores/gestorCategorias.js"></script>
		<script src="js/comun.js"></script>
		<script src="js/pages/registro-categoria.js"></script>
	</body>
</html>
