<!DOCTYPE html>
<html lang= "en">
	<head>
		<meta charset="UTF-8">
		<title>Agregar una Categoría</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css">
	</head>
 <body>
	<header>
			<h1>AGREGAR CATEGORIAS</h1>
			<a href="index.html" type="button">ATRÁS</a>
	</header>
	<main class="main-container">
		<form id="form-categoria" class="form-container container">
			<div class="form-group">
				<label for="nombre">Categoría:</label>
				<input 
					type="text" 
					id="nombre"
					name="nombre" 
					placeholder="Lacteos"
					required>
			</div>
			
			<button class="btn btn-primary" type="submit">Guardar</button>
		</form>

		<div id="modal" class="modal hidden">
			<div class="modal-content">
				<button class="modal-close" id="modal-close">X</button>
				<h3 id="modal-title"></h3>
				<p id="modal-message"></p>
			</div>
		</div>
	</main>
 
		<script src="js/pages/registro-categoria.js" type="module"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	</body>
</html>
